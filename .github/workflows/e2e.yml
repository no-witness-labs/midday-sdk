name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Pull Midnight Docker images
        run: |
          docker pull midnightntwrk/midnight-node:1.0.400
          docker pull midnightntwrk/indexer-standalone:4.3.7
          docker pull midnightntwrk/proof-server:8.1.3

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Helper-server images (faucet, fee relay) built from this SDK
        run: pnpm vitest run test/devnet.servers.integration.test.ts
        env:
          # Ensure Docker socket is available
          DOCKER_HOST: unix:///var/run/docker.sock
